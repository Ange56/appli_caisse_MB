<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Caisse Stand Marché</title>
  <link rel="stylesheet" href="style-caisse.css">
  <!-- Librairie HTML2PDF pour l'export PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <header>
    <h1>Caisse Stand Marché</h1>
  </header>

  <nav>
    <button class="active" onclick="switchTab('caisse', event)"> Caisse</button>
    <button onclick="switchTab('produits', event)"> Produits</button>
    <button onclick="switchTab('ventes', event)"> Bilan</button>
  </nav>

  <!-- ONGLET CAISSE -->
  <div id="caisse" class="tab-content active">
    <!-- Filtres par catégorie -->
    <div class="category-filters" id="category-filters"></div>

    <!-- Grille des produits -->
    <div class="grid" id="grid-produits"></div>

    <!-- Panier / Vente en cours -->
    <div class="summary-card">
      <h3>Vente en cours</h3>
      <ul class="history-list" id="ticket-list"></ul>
      <div class="summary-row total">
        <span>Total :</span>
        <span id="ticket-total">0,00 €</span>
      </div>
      <button class="btn-submit" style="margin-top: 12px;" onclick="validerVente()">Valider la vente</button>
    </div>
  </div>

  <!-- ONGLET PRODUITS -->
  <div id="produits" class="tab-content">
    <div class="summary-card">
      <h3 id="form-title">Ajouter / Modifier un produit</h3>
      <form id="form-produit" onsubmit="sauvegarderProduit(event)">
        <input type="hidden" id="prod-id">
        <div class="form-group">
          <label>Nom du produit</label>
          <input type="text" id="prod-nom" placeholder="ex: Clown (grand)" required>
        </div>
        <div class="form-group">
          <label>Catégorie</label>
          <select id="prod-categorie" required>
            <option value="Peluche">Peluche</option>
            <option value="Porte clé">Porte clé</option>
            <option value="Décoration">Décoration</option>
            <option value="Vêtements">Vêtements</option>
          </select>
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label>Prix (€)</label>
            <input type="number" step="0.5" id="prod-prix" placeholder="25">
            <small style="color: var(--ink-soft); font-size: 0.75rem;">Laisser vide si pas prêt</small>
          </div>
          <div style="flex: 1;">
            <label>Stock actuel</label>
            <input type="number" id="prod-stock" placeholder="2" required>
          </div>
        </div>
        <button type="submit" class="btn-submit">Enregistrer le produit</button>
      </form>
    </div>

    <table id="table-produits">
      <thead>
        <tr>
          <th>Produit</th>
          <th>Catégorie</th>
          <th>Prix</th>
          <th>Stock</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ONGLET BILAN & EXPORT PDF -->
  <div id="ventes" class="tab-content">
    <div class="summary-card" id="pdf-report">
      <h3>Bilan du Marché</h3>
      <div class="summary-row" style="margin-top: 10px;">
        <span>Total encaissé :</span>
        <strong id="bilan-total" style="color: var(--berry); font-size: 1.3rem;">0,00 €</strong>
      </div>
      <div class="summary-row">
        <span>Articles vendus :</span>
        <strong id="bilan-articles">0</strong>
      </div>
      <h4 style="margin-top: 15px; margin-bottom: 8px; color: var(--pine);">Détail des ventes</h4>
      <ul class="history-list" id="bilan-details-list"></ul>
    </div>

    <div class="summary-card">
      <h3>Export & Sauvegarde</h3>
      <button class="btn-submit" onclick="exporterPDF()"> Imprimer / Exporter le bilan en PDF</button>
      <button class="btn-submit btn-secondary" onclick="exporterDonneesJSON()"> Sauvegarder les données (.json)</button>
      <button class="btn-submit btn-secondary" onclick="document.getElementById('file-import').click()"> Importer une sauvegarde</button>
      <input type="file" id="file-import" style="display: none;" onchange="importerDonneesJSON(event)">
      <button class="btn-submit btn-danger" style="margin-top: 15px;" onclick="reinitialiserTout()"> Réinitialiser les données</button>
    </div>
  </div>

  <script src="app-caisse.js"></script>
</body>
</html>
